# config/thresholds.yaml — dosyadan TÜRETİLEMEYEN, adlandırılmış sabitler (CLAUDE.md ilke 6; Adım 6).
# Dosyadan türeyenler (upm ve upm'e bağlı koşu parametreleri) FileParams'tadır; buradaki "*_m" değerleri
# metre cinsindendir ve calibration.scaled_params / pipeline ile upm'e çarpılır.
# NOT: "base_*" değerleri 1 birim = 1 cm referans dosyada elle ayarlanmış BASE parametreleridir; upm/base_upm
# ile ölçeklenir (ifade biçimi korunur ki eval bit-bit aynı kalsın).
base_upm: 100.0
base:                      # calibration.BASE (1 birim = 1 cm için)
  res: 3.0                 # raster hücre boyu (birim)
  seal: 18                 # morfolojik kapama (piksel) — ölçeklenmez
  margin: 250.0            # kat bbox marjı (birim)
  door_arc_radius: [55.0, 130.0]   # kapı kanadı yayı yarıçapı (birim)
  door_wall_dist: 25.0     # menteşe ↔ duvar en büyük uzaklık (birim)
  door_max_boundary_dist: 15.0     # layer_raw yolunda aday ↔ oda sınırı (birim)
raster:
  max_cells: 30000000      # hücre üst sınırı; aşılırsa res büyütülür
  seal_small_m: 0.25       # çok kademeli mühür: küçük mühür (m)
  seal_small_min_px: 3
  seal_fallback_div: 2     # upm yoksa: seal // 2
  seed_radius_m: 0.7       # etiketten tohum arama yarıçapı (m)
  seed_radius_fallback_px: 12
  min_room_px: 30          # bu kadar pikselden küçük bölge oda değil (fallback)
  door_seg_ladder_m: [0.15, 1.0]   # kapı katmanı çizgilerinde merdiven basamağı elemesi (m)
  extra_exclude_class_vote: true   # layer_class=0 ∧ duvar kelimesi yok ∧ kalınlık modunda değil → paralel çift raster bariyerine girmez (ağırlık turu 1)
wall:
  thickness_m: [0.06, 0.45]        # paralel çift kalınlık aralığı (m); 6 cm: duş kabini camı elenir
  min_overlap_m: 0.18
  min_len_res: 8.0                 # en kısa duvar parçası (res katı)
  angled_min_len_res: 15.0
  cluster_tol_res: 3.0
  adaptive_walls_per_room: 8       # oda başına bu kadardan az duvar → büyük blok modu denenir
  thickness_bin_m: 0.01            # kalınlık histogramı kutu genişliği (thickness_mode kalibrasyonu)
  thickness_mode_min_share: 0.10   # bir kutu toplamın bu oranını geçerse mod
  thickness_mode_tol_m: 0.02       # segment kalınlığı bir moda bu kadar yakınsa thickness_mode = 1
  leak_fraction: 0.45
door:
  arc_sweep_deg: [55.0, 125.0]     # kapı kanadı yayı süpürme açısı
  upm_from_arc_min_m: 0.55         # amin / 0.55 → upm tahmini (arc_radius alt sınırı, m)
  cluster_radius_frac: 0.5         # aday kümeleme yarıçapı = max(min_units, amin × frac)
  cluster_radius_min_units: 20.0
  primary_min: 2                   # blok+yay adayı bu kadardan azsa layer_raw yoluna düş
  swing_match_factor: 1.6          # menteşe ↔ yay eşleşme toleransı = door_wall_dist × faktör
  vlm_snap_tol_units: 10.0
  leaf_m: 0.875                    # ana kapı kanadı ≈ 0.875 m (ölçek kestirimi)
  calib_top_frac: 0.85             # yarıçap kümesi: max'ın ≥ %85'i
  calib_min_doors: 3
  calib_priors: [100.0, 1000.0]    # etiket öncülü başarısızsa denenen upm öncülleri (cm, mm)
  calib_radius_frac: [0.3, 2.0]    # öncül × [0.3, 2.0] yarıçap aralığı
  upm_ratio_accept: [0.25, 4.0]    # kapı upm'i etiket upm'inin bu katları arasında ise kabul
  standard_priors: [100.0, 1000.0, 1.0, 10.0]   # hiçbir kümede kapı kanıtı yoksa yeniden kümeleme hipotezleri (cm, mm, m, dm)
  doors_vs_labels_max_dev: 1.0      # kapı upm'i etiket upm'inden 2 kattan fazla sapıyorsa birim şüpheli (etiket kestirimi sistematik ~%35 düşük; 0.3 tüm dosyaları işaretliyordu)
  hypothesis_strong_arcs: 10        # (a) etiket-öncülü kümelerinde kapı kanıtı bu kadardan azsa hipotez yolu tetiklenir; (b) hipotez içinde kat seçimi: küme yayı bu kadarsa o küme, değilse pick_plan_floor
  hypothesis_refine_accept: [0.7, 1.4]   # hipotez (standart öncül) seçildiyse kapı düzeltmesi yalnız bu bantta kabul (183/100 gibi büyük yaylar reddedilir)
graph:                             # Adım 9: duvar grafı (walls.build_wall_graph) + polygonize odalar (rooms.graph_faces)
  pair_thickness_m: [0.06, 0.45]   # merkez hattı için yüz çifti kalınlığı aralığı (wall.thickness_m ile aynı; dış duvar dahil)
  pair_ang_tol_deg: 8.0
  min_overlap_m: 0.18
  snap_tol_frac: 0.5               # uç-uç birleştirme toleransı = kalınlık × bu (FileParams.extra.graph_snap_tol)
  extend_tol_m: 0.6                # sarkan ucu yakın hatta uzatma toleransı (en dar açıklıktan kısa boşluk = duvar)
  merge_perp_frac: 1.0             # doğrultudaş merkez hatlarını birleştirme dik toleransı = kalınlık × bu
  face_merge_perp_frac: 0.2        # yüz kenarlarını birleştirme dik toleransı = kalınlık × bu (yüzler ayrı kalmalı)
  face_merge_ang_tol_deg: 3.0
  cavity_overlap_max: 0.6          # yüzün bu oranından fazlası duvar boşluğuysa oda değil
  door_closure_extend_frac: 0.5    # kapı kapatma kenarını iki uçtan kalınlık × bu kadar uzat
  door_cap_frac: 1.0               # kanat uçlarındaki dik kapak yarı uzunluğu = kalınlık × bu
  passage_min_m: 0.5               # geçiş açıklığı (kapısız) kapatma aralığı
  passage_max_m: 1.6
  passage_ang_tol_deg: 15.0
  seal_m: 0.12                     # yüz kenarı mühürü (raster seal_small_m'nin yarısı; 0.25 ince holleri yutuyor)
  min_room_area_m2: 1.0            # bundan küçük yüz oda değil
  thin_min_m: 0.45                 # 2·alan/çevre bunun altındaysa yüz ince (duvar boşluğu, koridor artığı)
  hole_area_max_frac: 0.5          # delik alanı bu oranı aşan yüz (bina çevresi halkası) elenir
  stair_buffer_m: 0.15             # basamak çizgileri tamponu → ayak izi
  stair_step_m: [0.15, 0.6]        # basamak çizgisi: bu dik aralıkta (iki basamağa kadar; uç basamak da sayılsın) ≥ stair_step_min_neighbors paralel komşu (_ladder_filter)
  stair_step_min_neighbors: 2      # (kısa kollar 3–4 basamak; blok basamaklar INSERT açılarak sayılır)
  stair_edge_ang_tol_deg: 10.0     # merdiven kenar çizgisi eksenlere bu kadar yakın olmalı (asansör çarpısı 45° → kenar değil)
  iou_match: 0.7                   # flood-fill odası ↔ yüz aynı mahal
  candidate_max_overlap: 0.3       # yüz, mevcut flood-fill odaları birleşimiyle bu orandan çok örtüşüyorsa aday değil (2026-09-13; eski overlap_ambiguous 0.5)
  merge_max_labels: 1              # ince-komşuluk bileşeni en fazla bu kadar oda etiketi içeriyorsa birleştirilir (2+ → ayrı odalar)
  merge_thin_cavity_max_frac: 0.3  # komşu iki yüzün ortak sınırının bu orandan azı duvar boşluğundaysa ayıran çizgi ince → birleştir
  merge_eps_m: 0.02                # ortak sınır/birleştirme toleransı
  absorb_min_room_frac: 0.9        # örtüşme kapısı istisnası: yüz, flood odasının bu oranını kapsıyorsa (ve başka odaya değmiyorsa) odayla birleşir
  absorb_area_ratio_max: 2.0       # ... ve etiket alan yazısı varsa yüz/yazı alan oranı [1/bu, bu] içinde (area_mismatch mutlak kuralı)
  merge_gap_max_m: 0.35            # iki yüz arasındaki ince çizgi bandı en çok bu kadar (kiriş izdüşümü genişliği ~0.25)
  merge_min_shared_m: 0.5          # ortak sınır en az bu kadar (köşe teması birleştirmez)
  candidate_hull_buffer_m: 0.3     # aday yüz, etiketli odaların dışbükey zarfının (−bu) içinde olmalı (bina dışı cep elenir)
  candidate_hull_min_frac: 0.8
swing:                             # binding._room_by_swing
  cos_min: 0.2
  dist_penalty: 0.4
  max_dist_m: 4.6                  # menteşe ↔ oda etiketi en büyük uzaklık (m); upm ile ölçeklenir (2026-09-04: 460 birimden)
  max_dist_units_fallback: 460.0   # upm bilinmiyorsa (sentetik testler) çizim birimi
labels:                            # pipeline.select_plan / parse.pick_plan_floor
  dedupe_m: 0.5
  cluster_gap_m: 7.0
  recluster_gap_m: 8.0
  min_rooms: 3
  door_evidence_top: 8
  bbox_margin_m: 2.5
  typical_room_m: 3.5              # etiket-mesafesi ölçek kestirimi
  table_thr: 0.85
  table_max_n: 16
  grid_tol_m: 0.3
  conf_min_n: 6                    # etiket-mesafesi kestirimi güveni: bu kadar etiketten az → düşük
  conf_narrow_iqr: 0.3             # nn mesafe IQR/medyan bu altında (dar, tablo benzeri) → düşük
  conf_repeat_share: 0.4           # nn mesafelerin bu payı aynı değerdeyse (tekrarlı) → düşük
  conf_min: 0.6                    # units_confidence bu altında → unit_suspect
validate:                        # Adım 7 issue üretimi (perception/validate.py)
  conflicting_layer_min_ratio: 0.3     # dosya × katman: çelişkili segment oranı ≥ bu
  conflicting_layer_min_count: 20      # ve çelişkili segment sayısı ≥ bu → tek conflicting_layer issue
  unknown_layer_min_entities: 50       # sınıfı bilinmeyen katmanda en az bu kadar entity → unknown_layer
  area_mismatch_frac: 0.15             # |yazı − geometri| / yazı > bu → area_mismatch
  ambiguous_opening_conf: 0.5          # açıklık güveni bunun altında → ambiguous_opening
  unit_standard_upm: [1.0, 10.0, 100.0, 1000.0]   # m, dm, cm, mm
  unit_tol_frac: 0.15                  # upm standart değerlerden bu oranda uzaksa → unit_suspect (0.25 → 0.15: 536_1'in 76 birim/m değeri işaretlensin; kapı kanadı 0.875 m varsayımının payı)
  # --- politika (kullanıcı kararı 2026-09-05)
  unknown_layer_max_per_file: 3        # entity × duvar-benzeri geometri oranına göre ilk N
  ambiguous_opening_conf: 0.5          # (yukarıdaki tekrar) toplu soru: yalnız penceresiz odaya değen adaylar
  ambiguous_touch_m: 0.3               # aday merkezi odaya bu kadar yakınsa "değiyor"
  area_convention_dev: 0.20            # oda oranı dosya medyanından bu kadar sapınca area_mismatch
  issues_per_room_target: 0.5          # bütçe ölçütü (2026-09-05): issue/oda; typical dosyada ≤ 0.5, rapor medyan + oran basar
  cli_page: 10                         # hitl/cli.py --list: etki sıralı ilk N, sonra --offset ile devam
  # --- yeni tipler (kullanıcı kararı 2026-09-05)
  area_abs_low: 0.5                    # yazı/geometri oranı bu altında ya da area_abs_high üstünde → her zaman issue
  area_abs_high: 2.0
  exterior_touch_m: 0.3                # oda kenarı kat dış sınırına bu kadar yakınsa dış duvara değiyor
  swing_margin_min: 0.15               # açılış yönü skoru: en iyi − ikinci < bu → door_side_ambiguous
stats:                                 # içerik-istatistiği katman sınıflandırması (names.stats_class)
  min_entities: 10
  long_line_m: 1.0                     # bu uzunluktan uzun düz çizgi yoksa → yapısal değil
  small_arc_m: 0.3
  short_line_m: 0.5
  text_share: 0.8                      # TEXT/MTEXT/DIMENSION payı ≥ → text/dim
  hatch_share: 0.8
  furniture_share: 0.6                 # küçük yay + kısa çizgi payı ≥ (uzun çizgi yokken) → furniture
  conf: 0.4
