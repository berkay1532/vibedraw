# config/weights.yaml — sinyal ağırlıkları (Adım 6). Kod içine ağırlık yazılmaz; ayar holdout ile (fam00 GT sonrası).
# Birleşim (scoring.score): conf = max(w_i × s_i) + agreement_bonus × (pozitif sinyal sayısı − 1), cap ile sınırlı.
# Adım 6 başlangıç değerleri Adım 2 güven tablosunu BİREBİR üretir: block 0.70, arc 0.75, block+arc 0.95,
# layer_raw 0.40, vlm 0.80. "gates": 0 dönen sinyal adayı eler (mevcut deterministik filtreler).
door:
  weights:
    block_class: 0.70
    arc_signature: 0.75
    layer_class: 0.40
    vlm: 0.80
  agreement_bonus: 0.20
  cap: 0.99
  gates: [wall_gap, room_boundary]
wall:
  weights:
    parallel_pair: 0.60          # eski "pair" güveni
    layer_class: 0.70            # + uyum bonusu 0.20 → eski "pair+layer" 0.90
    thickness_mode: 0.0          # iskelet: hesaplanır, ağırlık holdout ayarına kadar 0
    graph_connectivity: 0.0      # iskelet: henüz hesaplanmıyor (None)
  agreement_bonus: 0.20
  cap: 0.99
  gates: []
room:                            # flood-fill sonucu tek-sıcak: ağırlık = eski ROOM_CONF tablosu
  weights:
    flood_exclusive: 0.85
    alias_merge: 0.60
    voronoi: 0.50
    edge_fragment: 0.40
    fallback: 0.20
  agreement_bonus: 0.0
  cap: 0.99
  gates: []
window:                          # kaynak tek-sıcak: ağırlık = eski WINDOW_CONF tablosu
  weights:
    layer_class: 0.85
    block_keyword: 0.85
    block_geometry: 0.70
    thin_lines: 0.30
  agreement_bonus: 0.0
  cap: 0.99
  gates: []
