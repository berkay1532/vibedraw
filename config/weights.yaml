# config/weights.yaml — sinyal ağırlıkları (Adım 6). Kod içine ağırlık yazılmaz; ayar holdout ile (fam00 GT sonrası).
# Birleşim (scoring.score): conf = max(w_i × s_i) + agreement_bonus × (pozitif sinyal sayısı − 1), cap ile sınırlı.
# Adım 6 başlangıç değerleri Adım 2 güven tablosunu BİREBİR üretir: block 0.70, arc 0.75, block+arc 0.95,
# layer_raw 0.40, vlm 0.80. "gates": 0 dönen sinyal adayı eler (mevcut deterministik filtreler).
door:
  weights:
    block_class: 0.70
    arc_signature: 0.75
    layer_class: 0.40
    vlm: 0.80
  agreement_bonus: 0.20
  cap: 0.99
  gates: [wall_gap, room_boundary]
